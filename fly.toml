app = "repair-garden"
primary_region = "yvr"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  OPENAI_MODEL = "gpt-5.4-mini"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    grace_period = "12s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
